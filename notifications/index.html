<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relay</title>
    <link rel="stylesheet" href="/notification-assets/notifications.css">
  </head>
  <body>
    <main class="notification-stage" aria-live="polite">
      <article id="notification" class="notification-card" aria-hidden="true">
        <div class="notification-card__avatar-shell">
          <img id="notification-avatar" class="notification-card__avatar" src="/overlay-assets/relay-radar.png" alt="">
          <span class="notification-card__presence" aria-hidden="true"></span>
        </div>
        <div class="notification-card__copy">
          <div class="notification-card__identity">
            <strong id="notification-author" class="notification-card__author"></strong>
            <span id="notification-guild-tag" class="notification-card__tag" hidden>
              <img id="notification-guild-tag-badge" class="notification-card__tag-badge" alt="">
              <span id="notification-guild-tag-name"></span>
            </span>
          </div>
          <p id="notification-message" class="notification-card__message"></p>
        </div>
        <span class="notification-card__signal" aria-hidden="true"></span>
      </article>
      <article id="music" class="music-card" aria-hidden="true">
        <div class="music-card__stage">
          <div id="music-youtube-player" class="music-card__player" aria-hidden="true"></div>
          <img id="music-artwork" class="music-card__artwork" src="/overlay-assets/relay-radar.png" alt="">
        </div>
        <div class="music-card__copy">
          <span id="music-label" class="music-card__label">NOW PLAYING</span>
          <strong id="music-title" class="music-card__title"></strong>
          <div class="music-card__details">
            <span id="music-artist" class="music-card__artist"></span>
            <span id="music-meta" class="music-card__meta" hidden></span>
            <span id="music-time" class="music-card__time" hidden></span>
          </div>
          <div
            id="music-progress"
            class="music-card__progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            hidden
          >
            <span id="music-progress-fill" class="music-card__progress-fill"></span>
          </div>
        </div>
      </article>
      <audio id="notification-clock" muted preload="auto"></audio>
    </main>
    <div id="notification-move-layer" class="notification-move-layer" data-tauri-drag-region>
      <span id="notification-move-label" class="notification-move-badge">Move notification</span>
    </div>
    <script src="/notification-assets/notifications.js" defer></script>
  </body>
</html>
